name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  build:
    needs: test                     # тест ногоон бол л
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image нэр (ghcr жижиг үсэг шаарддаг)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}   # PR дээр push хийхгүй
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  smoke:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Бодит контейнер асаах
        run: docker run -d --name app -p 3000:3000 "$IMAGE:${{ github.sha }}"
      - name: /healthz бэлэн болохыг хүлээх
        run: |
          for i in $(seq 1 30); do curl -fs http://localhost:3000/healthz && exit 0; sleep 1; done
          docker logs app; exit 1
      - name: Нэг захиалга үүсгэх (201)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/reservations \
            -H 'Content-Type: application/json' \
            -d '{"equipmentId":"EQ-01","userId":"U-01","startAt":"2026-10-05T10:00:00Z","endAt":"2026-10-05T11:00:00Z"}')
          echo "status=$code"; test "$code" = "201"
